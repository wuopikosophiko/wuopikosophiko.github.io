<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Заколка — BLE-срез</title>
    <script type="module" crossorigin src="/spike/assets/index-DrE3u_lJ.js"></script>
    <link rel="stylesheet" crossorigin href="/spike/assets/index-DDKtDWCi.css">
  </head>
  <body>
    <h1>Заколка — BLE-срез</h1>
    <p id="support" class="warn" hidden></p>

    <section>
      <div class="row">
        <button id="connect">Подключить</button>
        <button id="disconnect" disabled>Отключить</button>
        <button id="status" disabled>Статус</button>
      </div>
      <dl id="info"></dl>
    </section>

    <section>
      <h2>Картинка</h2>
      <canvas id="frame"></canvas>
      <div class="row">
        <label class="file">Выбрать фото<input id="file" type="file" accept="image/*" /></label>
        <label>Слот
          <select id="slot">
            <option value="3" selected>Свой</option>
            <option value="1">A</option>
            <option value="2">B</option>
          </select>
        </label>
        <label>Качество <input id="quality" type="number" min="0.3" max="0.95" step="0.05" value="0.85" /></label>
      </div>
      <div class="row">
        <button id="send" disabled>Отправить</button>
        <button id="speed" disabled>Тест скорости 450 КБ</button>
        <button id="cancel" disabled>Отменить</button>
      </div>
      <progress id="progress" max="1" value="0"></progress>
      <dl id="transfer"></dl>
    </section>

    <section>
      <h2>Файл .clip</h2>
      <p class="hint">Готовый файл из <code>protocol/tools/make_clip.py</code> или эталон из векторов.</p>
      <div class="row">
        <label class="file">Выбрать .clip<input id="clip-file" type="file" accept=".clip,application/octet-stream" /></label>
        <label>Слот
          <select id="clip-slot">
            <option value="3" selected>Свой</option>
            <option value="1">A</option>
            <option value="2">B</option>
          </select>
        </label>
        <button id="clip-send" disabled>Отправить файл</button>
      </div>
      <div class="row">
        <button id="vec-text" disabled>Эталон: лента</button>
        <button id="vec-anim" disabled>Эталон: анимация</button>
      </div>
    </section>

    <section>
      <h2>Показ</h2>
      <div class="row">
        <button id="show-custom" disabled>Показать Свой</button>
        <button id="show-preset" disabled>Вернуть пресет</button>
        <button id="slots" disabled>Слоты</button>
      </div>
      <dl id="slot-info"></dl>
    </section>

    <section>
      <h2>Лента</h2>
      <div class="row">
        <label>Слот
          <select id="text-slot">
            <option value="3" selected>Свой</option>
            <option value="1">A</option>
            <option value="2">B</option>
          </select>
        </label>
        <label>Текст <input id="text-fg" type="color" value="#ffffff" /></label>
        <label>Фон <input id="text-bg" type="color" value="#000000" /></label>
        <label>Скорость
          <select id="text-speed">
            <option value="0">0 — стоит</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </label>
        <button id="text-apply" disabled>Применить</button>
      </div>
    </section>

    <section>
      <h2>Экран</h2>
      <div class="row">
        <label class="grow">Яркость <input id="brightness" type="range" min="0" max="255" value="179" disabled /></label>
        <span id="brightness-value">179</span>
      </div>
      <div class="row">
        <label class="check"><input id="rotate" type="checkbox" disabled /> Поворот 180°</label>
      </div>
    </section>

    <section>
      <h2>Журнал</h2>
      <div class="row">
        <button id="copy-log">Скопировать журнал</button>
        <label class="check"><input id="frames" type="checkbox" /> показывать байты</label>
      </div>
      <pre id="log"></pre>
    </section>
  </body>
</html>
